version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ab_network

  redis:
    image: redis:7-alpine
    container_name: ab_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ab_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ab_api
    restart: unless-stopped
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FULLNAME: ${ADMIN_FULLNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS}
      RANDOM_SECRET: ${RANDOM_SECRET}
      CONFIG_PATH: ${CONFIG_PATH}
    networks:
      - ab_network

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: ab_telegram_bot
    restart: unless-stopped
    ports:
      - "${TELEGRAM_BOT_PORT}:${TELEGRAM_BOT_PORT}"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      RANDOM_SECRET: ${RANDOM_SECRET}
      TELEGRAM_BOT_HOST: 0.0.0.0
      TELEGRAM_BOT_PORT: ${TELEGRAM_BOT_PORT}
      CONFIG_PATH: ${CONFIG_PATH}
    networks:
      - ab_network

volumes:
  postgres_data:
  redis_data:

networks:
  ab_network:
    driver: bridge
